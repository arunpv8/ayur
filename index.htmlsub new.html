<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4d33">
<title>Ayur Patient Notes</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+Malayalam:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --g9:#163a26;--g8:#1f4d33;--g7:#2b6243;--g6:#3a7a55;--g2:#dcebdf;--g1:#eef5ef;
 --gold:#c98a2b;--gold2:#f6e7cc;--bg:#f5f2ea;--card:#fff;--ink:#1d2420;--ink2:#56605a;--ink3:#8a938d;
 --line:#e6e2d8;--red:#b9412f;--red1:#fbe8e4;--blue:#2d6a9f;--blue1:#e5f0fa;
 --r:18px;--sh:0 1px 2px #1d24200d,0 4px 14px #1d24200f;
 --f:"Manrope","Noto Sans Malayalam",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px}
button{font-family:inherit;cursor:pointer}
/* app bar */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:4px;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;background:var(--g8);color:#fff;transition:background .2s}
header h1{flex:1;margin:0;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.1px}
header .hb{background:#ffffff14;border:0;color:#fff;width:40px;height:40px;border-radius:12px;font-size:20px;display:flex;align-items:center;justify-content:center}
header.home{background:var(--g9)}
main{max-width:680px;margin:auto;padding:0 14px 120px}
/* hero */
.hero{margin:0 -14px;padding:6px 18px 54px;background:linear-gradient(160deg,var(--g9) 0%,var(--g8) 55%,var(--g7) 100%);color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-30px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,#c98a2b33,transparent 70%)}
.hero .hi{font-size:13px;opacity:.75;margin:2px 0 2px}
.hero .ttl{font-size:22px;font-weight:800;margin:0 0 12px;letter-spacing:-.2px}
.cpill{display:inline-flex;align-items:center;gap:8px;background:#ffffff1c;border:1px solid #ffffff30;color:#fff;border-radius:30px;padding:8px 14px;font-size:14px;font-weight:600;position:relative;z-index:1}
.cpill .dot{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:-40px 0 14px;position:relative;z-index:2}
.stat{background:var(--card);border-radius:16px;padding:12px 6px 10px;text-align:center;box-shadow:var(--sh);border:0}
.stat b{display:block;font-size:24px;font-weight:800;line-height:1.1}
.stat span{font-size:11.5px;color:var(--ink2);font-weight:600}
.stat.t b{color:var(--g7)}.stat.o b{color:var(--red)}.stat.w b{color:var(--blue)}.stat.a b{color:var(--gold)}
.search{position:relative;margin:4px 0 12px}
.search input{padding-left:42px;height:50px;border-radius:15px;border:1px solid var(--line);box-shadow:var(--sh)}
.search::before{content:"";position:absolute;left:15px;top:16px;width:12px;height:12px;border:2.2px solid var(--ink3);border-radius:50%}
.search::after{content:"";position:absolute;left:27px;top:29px;width:7px;height:2.2px;background:var(--ink3);transform:rotate(45deg);border-radius:2px}
.cbar{display:flex;gap:8px;overflow-x:auto;padding:2px 14px 8px;margin:0 -14px;scrollbar-width:none}
.cbar::-webkit-scrollbar{display:none}
.cbar button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:30px;padding:8px 14px;font-size:13.5px;font-weight:600;white-space:nowrap}
.cbar button i{font-style:normal;margin-left:6px;background:var(--g1);color:var(--g7);border-radius:10px;padding:1px 7px;font-size:12px}
.cbar button.on{background:var(--g8);border-color:var(--g8);color:#fff}
.cbar button.on i{background:#ffffff26;color:#fff}
/* sections */
.sh{display:flex;align-items:center;gap:8px;margin:20px 2px 8px;font-weight:800;font-size:15px;color:var(--ink)}
.sh .n{background:var(--g1);color:var(--g7);border-radius:10px;padding:1px 9px;font-size:12.5px}
.sh.od{color:var(--red)}.sh.od .n{background:var(--red1);color:var(--red)}
.sh .bar{width:4px;height:16px;border-radius:3px;background:var(--g6)}.sh.od .bar{background:var(--red)}.sh.wk .bar{background:var(--blue)}.sh.all .bar{background:var(--gold)}
.empty{color:var(--ink3);font-size:14px;margin:2px 4px 6px}
.card{background:var(--card);border-radius:var(--r);padding:14px 16px;margin:10px 0;box-shadow:var(--sh)}
/* patient card */
.pt{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px}
.av{width:46px;height:46px;flex:none;border-radius:15px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:var(--g8);background:var(--g2)}
.av.F{background:#f7e3e8;color:#9b3953}.av.M{background:var(--blue1);color:var(--blue)}
.pt .info{flex:1;min-width:0}
.pt .nm{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt .meta{color:var(--ink2);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:8px;padding:2px 8px;margin-top:5px;margin-right:4px}
.tag.c{background:var(--gold2);color:#8a5a12}
.tag.n{background:var(--g1);color:var(--g7)}.tag.n.od{background:var(--red1);color:var(--red)}
.ic{width:40px;height:40px;flex:none;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--g1);text-decoration:none}
.ic svg{width:19px;height:19px;fill:none;stroke:var(--g7);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.wa{background:#e4f6ea}.ic.wa svg{stroke:#1f8a4c}
/* forms */
label{display:block;font-size:12.5px;color:var(--ink2);font-weight:700;margin:14px 0 6px;letter-spacing:.2px}
input,textarea,select{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:#fcfbf8;font-family:inherit;color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--g6);box-shadow:0 0 0 3px #3a7a5526;background:#fff}
textarea{resize:vertical;min-height:52px;line-height:1.45}
.fsec{margin:18px 0 4px;display:flex;align-items:center;gap:10px;color:var(--g8);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.7px}
.fsec::after{content:"";flex:1;height:1px;background:var(--line)}
.fsec:first-child{margin-top:2px}
h4{margin:14px 0 4px;color:var(--g7);font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{border:1px solid var(--line);background:#fcfbf8;border-radius:11px;padding:9px 13px;font-size:14px;color:var(--ink2);font-weight:600}
.chips button.on{background:var(--g8);color:#fff;border-color:var(--g8)}
.quick{margin-top:8px}.quick button{padding:6px 10px;font-size:12.5px}
.irow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:var(--ink2);font-weight:600}
.int{flex:none;gap:5px}.int button{width:42px;padding:8px 0;text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid3{display:grid;grid-template-columns:1fr 1.3fr .7fr;gap:6px;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:13px;padding:13px 16px;font-size:15px;font-weight:700;background:var(--g8);color:#fff;text-decoration:none;text-align:center}
.btn.sec{background:var(--g1);color:var(--g8)}
.btn.gold{background:var(--gold);color:#fff}
.btn.red{background:var(--red1);color:var(--red)}
.btn.sm{padding:9px 12px;font-size:13px;border-radius:11px}
.btn.w{width:100%}
.row{display:flex;gap:8px;align-items:center}
.fab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));height:58px;padding:0 22px 0 18px;border-radius:20px;border:0;background:var(--gold);color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px #c98a2b66;z-index:15}
.fab span{font-size:26px;font-weight:600;line-height:1}
.savebar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);z-index:16}
.savebar .btn{width:100%;max-width:652px;display:flex;margin:auto;font-size:16.5px;padding:15px;box-shadow:0 6px 18px #1f4d3355}
.med{border:1px solid var(--line);border-radius:14px;padding:9px;margin:8px 0;background:#fcfbf8}
.x{border:0;background:var(--red1);color:var(--red);border-radius:11px;width:42px;height:44px;font-size:15px;flex:none}
/* patient view */
.phead{margin:0 -14px;padding:16px 18px 20px;background:linear-gradient(160deg,var(--g9),var(--g7));color:#fff}
.phead .top{display:flex;gap:14px;align-items:center}
.phead .av{width:58px;height:58px;font-size:20px;border-radius:18px;background:#ffffff22;color:#fff}
.phead .nm{font-size:20px;font-weight:800}
.phead .meta{opacity:.8;font-size:13.5px;margin-top:3px}
.phead .acts{display:flex;gap:8px;margin-top:14px}
.phead .acts a,.phead .acts button{flex:1;min-width:0;padding:10px 4px!important;display:flex;align-items:center;justify-content:center;gap:6px;background:#ffffff1a;border:1px solid #ffffff2a;color:#fff;border-radius:12px;padding:10px;font-size:13.5px;font-weight:700;text-decoration:none}
.phead svg{width:17px;height:17px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.due{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 0;padding:12px 14px;background:var(--g1);border-radius:14px;font-size:14px;color:var(--g8)}
.due.od{background:var(--red1);color:var(--red)}
.link{background:none;border:0;color:inherit;opacity:.8;text-decoration:underline;font-size:12.5px;font-weight:600}
.kv{margin:6px 0;font-size:14px;line-height:1.5}.kv b{color:var(--ink2);font-weight:700}
.rx{margin:4px 0 0;padding-left:20px}.rx li{margin:3px 0}
details.card{padding:0;overflow:hidden}
details.card summary{list-style:none;padding:14px 16px;display:flex;align-items:center;gap:10px}
details.card summary::-webkit-details-marker{display:none}
details.card summary .d{flex:none;text-align:center;background:var(--g1);color:var(--g8);border-radius:12px;padding:6px 9px;font-weight:800;line-height:1.1;font-size:17px}
details.card summary .d small{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase}
details.card summary .s{flex:1;min-width:0;font-size:14px}
details.card summary .s b{display:block;font-size:14.5px}
details.card summary .s span{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
details.card summary .chev{color:var(--ink3);transition:.2s;font-size:18px}
details[open].card summary .chev{transform:rotate(90deg)}
details .body{padding:0 16px 16px;border-top:1px solid var(--line)}
.lastv{background:var(--gold2);color:#6b4710;border-radius:14px;padding:11px 14px;font-size:13.5px;margin:12px 0 0;line-height:1.5}
.warn{display:flex;gap:10px;align-items:center;background:#fff6e3;border:1px solid #f0d9a6;border-radius:15px;padding:11px 13px;font-size:13.5px;margin:12px 0 0;color:#6b4710}
.warn .btn{flex:none}
/* settings */
.set h3{margin:0 0 4px;font-size:16px;font-weight:800}
.muted{color:var(--ink2);font-size:13.5px;line-height:1.5}
.clist{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.clist span{display:inline-flex;align-items:center;gap:6px;background:var(--g1);color:var(--g8);border-radius:10px;padding:7px 6px 7px 12px;font-size:13.5px;font-weight:700}
.clist span button{border:0;background:#fff;color:var(--red);border-radius:7px;width:24px;height:24px;font-size:12px}
/* sheet */
.sheet{position:fixed;inset:0;background:#0007;z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fd .15s}
.sheet .in{background:var(--card);width:100%;max-width:680px;border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out;max-height:80vh;overflow:auto}
.sheet .grab{width:40px;height:4px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 10px;font-size:16px}
.sheet .opt{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;padding:14px 6px;font-size:15.5px;font-weight:600;border-bottom:1px solid var(--line);color:var(--ink);text-align:left}
.sheet .opt.on{color:var(--g7)}.sheet .opt.on::after{content:"✓";font-weight:800}
@keyframes up{from{transform:translateY(40px);opacity:.4}}@keyframes fd{from{opacity:0}}
.lock{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--g9),var(--g7));color:#fff;margin:0 -14px;padding:20px}
.lock .logo{width:76px;height:76px;border-radius:24px;background:#ffffff1c;display:flex;align-items:center;justify-content:center;font-size:38px;margin-bottom:14px}
.lock input{max-width:220px;text-align:center;font-size:26px;letter-spacing:10px;margin:14px auto;background:#ffffff16;border-color:#ffffff40;color:#fff}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:50}
#toast.show{opacity:1;transform:translateX(-50%)}
.fade{animation:fd .18s}
details.dqbox{border:1px solid #c9dff2;background:#f6fafd;border-radius:16px;margin:14px -4px 4px;overflow:hidden}
details.dqbox>summary{list-style:none;padding:13px 14px;display:flex;align-items:center;gap:8px;font-weight:800;color:#1d4f7a;font-size:15px}
details.dqbox>summary::-webkit-details-marker{display:none}
details.dqbox>summary .pg{margin-left:auto;background:#fff;border-radius:10px;padding:2px 9px;font-size:12.5px;color:var(--blue)}
.dqin{padding:0 12px 14px}
.dqsec{margin:16px 0 6px;font-size:12px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--blue)}
.dqq{background:#fff;border-radius:13px;padding:11px 12px;margin:8px 0;border:1px solid #e3ecf4}
.dqq .qt{font-size:14.5px;font-weight:600;line-height:1.45;margin-bottom:8px}
.dqq .qt small{display:inline-block;background:var(--blue1);color:var(--blue);border-radius:6px;padding:0 6px;margin-right:6px;font-weight:800;font-size:11.5px}
.dqq .chips button{font-size:13.5px;padding:8px 11px;text-align:left}
.dqq .chips button i{font-style:normal;font-size:11px;opacity:.65;margin-left:4px}
.dqq.red{border-color:#f0c6bd}
.gr button{min-width:60px;text-align:center!important}
.dqres{background:#fff;border:2px solid var(--blue);border-radius:16px;padding:14px;margin-top:14px}
.dqres h5{margin:0 0 10px;font-size:15px;color:#1d4f7a}
.dbar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13.5px;font-weight:700}
.dbar span{width:52px}.dbar div{flex:1;height:10px;background:#eef2f5;border-radius:6px;overflow:hidden}
.dbar div b{display:block;height:100%;border-radius:6px}
.dbar em{font-style:normal;width:64px;text-align:right;color:var(--ink2);font-size:12.5px}
.dqline{font-size:14px;line-height:1.5;margin:7px 0}.dqline b{color:var(--ink)}
.rxs{background:var(--g1);border:1.5px solid var(--g2);border-radius:16px;padding:12px;margin:10px 0}
.rxtop{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.rxtop b{font-size:15px;color:var(--g8)}
.rxlab{font-size:12.5px;margin:8px 0 6px}.rxauto{background:var(--blue1);color:#1d4f7a;border-radius:8px;padding:1px 7px;font-size:11.5px}.rxauto.m{background:var(--gold2);color:#6b4710}
.rxf{margin:6px 0}.rxf button{padding:6px 10px;font-size:12.5px}
.rxsec{font-weight:800;font-size:13px;color:var(--g8);margin:12px 0 2px;border-top:1px dashed #c9dccd;padding-top:9px}
.rxh{font-size:12.5px;font-weight:700;color:var(--ink2);margin:7px 0 5px}.rxh span{font-weight:500;color:var(--ink3)}
.rxcs{display:flex;flex-wrap:wrap;gap:6px}
.rxc{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;font-size:12.5px;font-weight:600;color:var(--ink2);text-align:left;line-height:1.3}
.rxc.f{border-color:var(--g6);color:var(--g8)}.rxc.on{background:var(--g8);border-color:var(--g8);color:#fff}
.rxc i{font-style:normal;font-size:10.5px;opacity:.6;margin-left:4px}
.rxmore summary{font-size:13px;font-weight:700;color:var(--blue);margin-top:12px;cursor:pointer}
.rxnone{font-size:13px;margin:8px 0}.rxfoot{font-size:11.5px;margin-top:10px}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.ctile{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px;text-align:left;box-shadow:var(--sh);display:flex;flex-direction:column;gap:4px;min-height:92px}
.ctile.cur{border-color:var(--g6)}.ctile b{font-size:15px;color:var(--g9)}.ctile .cn{font-size:22px;font-weight:800;color:var(--g7)}.ctile .cn small{font-size:12px;font-weight:600;color:var(--ink3)}
.ctile .cs{display:flex;gap:5px;flex-wrap:wrap}.ctile .cs i{font-style:normal;font-size:11.5px;font-weight:700;border-radius:8px;padding:2px 7px}.ctile .cs .t{background:var(--g1);color:var(--g7)}.ctile .cs .o{background:var(--red1);color:var(--red)}
.odbox summary{list-style:none;cursor:pointer}.odbox summary::-webkit-details-marker{display:none}.odbox summary em{margin-left:auto;font-style:normal;font-size:12.5px;color:var(--blue);font-weight:700}.odbox[open] summary em{display:none}
.rxdx{margin:8px 0;background:#fff;border:1px solid var(--g2);border-radius:12px;padding:8px 10px}.rxdx summary{font-size:13px;cursor:pointer;list-style:none;line-height:1.5}.rxdx summary::-webkit-details-marker{display:none}
.rxsy{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}.rxsy>button,.rxadd button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.rxsy>button.on{background:var(--blue1);border-color:#b9d3ea;color:#1d4f7a}.rxlab2{font-size:12.5px;font-weight:700;color:var(--ink2)}
.rxadd{display:contents}.rxadd summary{list-style:none;border:1px dashed var(--g6);color:var(--g7);border-radius:20px;padding:5px 12px;font-weight:800;cursor:pointer}.rxadd summary::-webkit-details-marker{display:none}
.rxadd[open]{display:flex;flex-wrap:wrap;gap:6px;width:100%;background:#fff;border-radius:12px;padding:8px}
.rxagree{background:#fff;border:1.5px solid var(--gold);border-radius:12px;padding:8px 10px;margin:8px 0}.rxtph{font-size:12.5px;font-weight:800;color:var(--g8);margin-bottom:6px}.rxtph span{font-weight:500;color:var(--ink3)}
.rxtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#fff;border-radius:12px;padding:4px;margin:10px 0 8px;border:1px solid var(--g2)}
.rxtabs button{border:0;background:transparent;border-radius:9px;padding:9px 4px;font-size:13px;font-weight:700;color:var(--ink2)}.rxtabs button.on{background:var(--g8);color:#fff}
.rxtabs i{font-style:normal;font-size:11px;margin-left:4px;opacity:.7}
.rxtp{background:#fff;border-radius:12px;padding:8px 10px;border:1px solid var(--g2)}.rxtr{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px dashed var(--line)}.rxtr:last-child{border:0}
.rxwhy{font-size:11.5px;color:var(--ink3);line-height:1.35;flex:1}.rxtr .rxc{flex:none;max-width:62%}

function parseVitals(t){const o={},T=' '+String(t).toLowerCase().replace(/(\d)\s*\.\s*(\d)/g,'$1.$2')+' ';

 let x=m(/(?:\bbp\b|b\s*\.?\s*p\b|blood\s*pressure|ബിപി|ബി\s*പി|പ്രഷർ|pressure)\D{0,8}?(\d{2,3})\s*(?:\/|by|over|ബൈ|-|\s)\s*(\d{2,3})/i);if(x)o.bp=x[1]+'/'+x[2];

 x=m(/(?:\bfbs\b|fasting|ഫാസ്റ്റിംഗ്|ഫാസ്റ്റിങ്)\D{0,14}?(\d{2,3})/i);if(x)o.fbs=x[1];

 if(!o.fbs&&!o.rbs&&!o.ppbs){x=m(/(?:sugar|ഷുഗർ|ഷുഗര്)\D{0,10}?(\d{2,3})/i);if(x)o.rbs=x[1]}

  if(f[1]==='X'){let op=false;for(let j=i+1;j<sch.length&&sch[j][1]!=='/X';j++){const x=v[sch[j][0]];if(x&&(!Array.isArray(x)||x.length))op=true}h+=`<details class="xmore"${op?' open':''}><summary>${f[2]}</summary>`;return}

/* Firestore cannot store arrays inside arrays → wrap inner arrays as {_a:[…]} and unwrap on read */
function fsEnc(x){if(Array.isArray(x))return x.map(y=>Array.isArray(y)?{_a:fsEnc(y)}:fsEnc(y));if(x&&typeof x==='object'){const o={};for(const k in x)o[k]=fsEnc(x[k]);return o}return x}
function fsDec(x){if(Array.isArray(x))return x.map(fsDec);if(x&&typeof x==='object'){const ks=Object.keys(x);if(ks.length===1&&ks[0]==='_a'&&Array.isArray(x._a))return fsDec(x._a);const o={};for(const k of ks)o[k]=fsDec(x[k]);return o}return x}
function clean(p){const o=fsEnc(JSON.parse(JSON.stringify(p)));delete o._s;for(const k of Object.keys(o))if(/[\/.]/.test(k)||/^__.*__$/.test(k))delete o[k];
 (o.visits||[]).forEach(v=>{for(const k of Object.keys(v))if(/[\/.]/.test(k)||/^__.*__$/.test(k))delete v[k]});return o}
function touch(p){if(!p)return;p.updated=Date.now();delete p._s;save();push(p)}
function push(p){if(!live())return;if(!p.updated)p.updated=Date.now();
 let w;try{w=col().doc(p.id).set(clean(p))}catch(e){setCloud('err',(p.name||'')+': '+(e.code||e.message));return}
 w.then(()=>{p._s=1;save();if(stack.length&&stack[stack.length-1][0]===home)softRender()}).catch(e=>setCloud('err',e.code||e.message))}
function cloudDel(id){if(live())col().doc(id).delete().catch(e=>setCloud('err',e.code||e.message))}
function pushMeta(){if(!live())return;db.metaUpdated=Date.now();save();
 metaRef().set({meds:db.meds,centres:db.centres,clinic:db.clinic||'',doc:db.doc,updated:db.metaUpdated}).catch(e=>setCloud('err',e.code||e.message))}
function mergeMeta(m){if(!m)return false;let ch=false;
 (m.meds||[]).forEach(x=>{if(!db.meds.some(y=>y.toLowerCase()===String(x).toLowerCase())){db.meds.push(x);ch=true}});
 (m.centres||[]).forEach(c=>{if(!db.centres.includes(c)){db.centres.push(c);ch=true}});
 if((m.updated||0)>(db.metaUpdated||0)){if(m.clinic&&m.clinic!==db.clinic){db.clinic=m.clinic;ch=true}if(m.doc&&JSON.stringify(m.doc)!==JSON.stringify(db.doc)){db.doc=Object.assign({},DOC0,m.doc);ch=true}}
 if(ch){db.meds.sort((a,b)=>a.localeCompare(b));refreshMedlist()}return ch}
function softRender(){if(locked||!stack.length)return;const[fn,a]=stack[stack.length-1];
 if(fn===home&&!($('#q')&&$('#q').value)||fn===patientView){const y=scrollY;fn(...a);scrollTo(0,y)}}
function stopSync(){cloud.unsub.forEach(f=>{try{f()}catch(e){}});cloud.unsub=[];cloud.synced=false}
function startSync(){
 setCloud('sync','');
 startIntake();
 cloud.unsub.push(metaRef().onSnapshot(s=>{if(mergeMeta(s.data())){save();softRender()}},()=>{}));
 cloud.unsub.push(col().onSnapshot({includeMetadataChanges:true},snap=>{
  let ch=false;
  snap.docChanges().forEach(c=>{
   const id=c.doc.id,d=fsDec(c.doc.data()),i=db.patients.findIndex(p=>p.id===id);
   if(c.type==='removed'){if(cloud.synced&&i>=0&&!c.doc.metadata.hasPendingWrites){db.patients.splice(i,1);ch=true}return}
   if(i<0){db.patients.push({...d,visits:d.visits||[],_s:1});ch=true}
   else if((d.updated||0)>(db.patients[i].updated||0)){db.patients[i]={...d,visits:d.visits||[],_s:1};ch=true}
  });
  if(!cloud.synced&&!snap.metadata.fromCache){
   /* first full server copy: upload what's only here, drop what was deleted elsewhere */
   const cm=new Map(snap.docs.map(d=>[d.id,fsDec(d.data())]));
   cloud.synced=true;
   db.patients=db.patients.filter(p=>{const c=cm.get(p.id);
    if(!c){push(p);return true} /* never drop local data on first sync — re-upload instead */
    if((p.updated||0)>(c.updated||0))push(p);else if(!p._s){p._s=1;ch=true}
    return true});
   pushMeta();
  }
  if(ch){save();softRender()}
  setCloud(!cloud.synced||snap.metadata.fromCache?(navigator.onLine?'sync':'offline'):snap.metadata.hasPendingWrites?'pend':'ok','');
 },e=>{setCloud('err',e.code||e.message)}));
}

 const body=ov.querySelector('.dvbody');if(!data){body.innerHTML='<div style="color:#fff;padding:30px">കിട്ടിയില്ല — ഇന്റർനെറ്റ് / ലോഗിൻ നോക്കുക.</div>'}
 else if(m.type==='img')body.innerHTML=`<img src="${data}" alt="">`;else body.innerHTML=`<div style="padding:30px;text-align:center"><button class="btn" data-a="o">PDF തുറക്കുക</button></div>`;
 const blob=()=>{const b=atob(data.split(',')[1]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new Blob([u],{type:m.type==='img'?'image/jpeg':'application/pdf'})};
 ov.onclick=async e=>{const a=e.target.closest('[data-a]');if(!a)return;const k=a.dataset.a;
  if(k==='x')ov.remove();else if(k==='z'){ov.classList.toggle('zoom')}else if(k==='s'&&data){await shareFile(blob(),m.name.replace(/[^\wഀ-ൿ]+/g,'_')+(m.type==='img'?'.jpg':'.pdf'))}
  else if(k==='o'&&data){window.open(URL.createObjectURL(blob()),'_blank')}
  else if(k==='d'){if(!confirm('ഈ രേഖ ഡിലീറ്റ് ചെയ്യട്ടെ?'))return;try{docsCol().doc(id).delete()}catch(x){}p.docs=(p.docs||[]).filter(d=>d.id!==id);touch(p);ov.remove();render()}}}
