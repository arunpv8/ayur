<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4d33">
<title>Ayur Patient Notes</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+Malayalam:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --g9:#163a26;--g8:#1f4d33;--g7:#2b6243;--g6:#3a7a55;--g2:#dcebdf;--g1:#eef5ef;
 --gold:#c98a2b;--gold2:#f6e7cc;--bg:#f5f2ea;--card:#fff;--ink:#1d2420;--ink2:#56605a;--ink3:#8a938d;
 --line:#e6e2d8;--red:#b9412f;--red1:#fbe8e4;--blue:#2d6a9f;--blue1:#e5f0fa;
 --r:18px;--sh:0 1px 2px #1d24200d,0 4px 14px #1d24200f;
 --f:"Manrope","Noto Sans Malayalam",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px}
button{font-family:inherit;cursor:pointer}
/* app bar */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:4px;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;background:var(--g8);color:#fff;transition:background .2s}
header h1{flex:1;margin:0;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.1px}
header .hb{background:#ffffff14;border:0;color:#fff;width:40px;height:40px;border-radius:12px;font-size:20px;display:flex;align-items:center;justify-content:center}
header.home{background:var(--g9)}
main{max-width:680px;margin:auto;padding:0 14px 120px}
/* hero */
.hero{margin:0 -14px;padding:6px 18px 54px;background:linear-gradient(160deg,var(--g9) 0%,var(--g8) 55%,var(--g7) 100%);color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-30px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,#c98a2b33,transparent 70%)}
.hero .hi{font-size:13px;opacity:.75;margin:2px 0 2px}
.hero .ttl{font-size:22px;font-weight:800;margin:0 0 12px;letter-spacing:-.2px}
.cpill{display:inline-flex;align-items:center;gap:8px;background:#ffffff1c;border:1px solid #ffffff30;color:#fff;border-radius:30px;padding:8px 14px;font-size:14px;font-weight:600;position:relative;z-index:1}
.cpill .dot{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:-40px 0 14px;position:relative;z-index:2}
.stat{background:var(--card);border-radius:16px;padding:12px 6px 10px;text-align:center;box-shadow:var(--sh);border:0}
.stat b{display:block;font-size:24px;font-weight:800;line-height:1.1}
.stat span{font-size:11.5px;color:var(--ink2);font-weight:600}
.stat.t b{color:var(--g7)}.stat.o b{color:var(--red)}.stat.w b{color:var(--blue)}.stat.a b{color:var(--gold)}
.search{position:relative;margin:4px 0 12px}
.search input{padding-left:42px;height:50px;border-radius:15px;border:1px solid var(--line);box-shadow:var(--sh)}
.search::before{content:"";position:absolute;left:15px;top:16px;width:12px;height:12px;border:2.2px solid var(--ink3);border-radius:50%}
.search::after{content:"";position:absolute;left:27px;top:29px;width:7px;height:2.2px;background:var(--ink3);transform:rotate(45deg);border-radius:2px}
.cbar{display:flex;gap:8px;overflow-x:auto;padding:2px 14px 8px;margin:0 -14px;scrollbar-width:none}
.cbar::-webkit-scrollbar{display:none}
.cbar button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:30px;padding:8px 14px;font-size:13.5px;font-weight:600;white-space:nowrap}
.cbar button i{font-style:normal;margin-left:6px;background:var(--g1);color:var(--g7);border-radius:10px;padding:1px 7px;font-size:12px}
.cbar button.on{background:var(--g8);border-color:var(--g8);color:#fff}
.cbar button.on i{background:#ffffff26;color:#fff}
/* sections */
.sh{display:flex;align-items:center;gap:8px;margin:20px 2px 8px;font-weight:800;font-size:15px;color:var(--ink)}
.sh .n{background:var(--g1);color:var(--g7);border-radius:10px;padding:1px 9px;font-size:12.5px}
.sh.od{color:var(--red)}.sh.od .n{background:var(--red1);color:var(--red)}
.sh .bar{width:4px;height:16px;border-radius:3px;background:var(--g6)}.sh.od .bar{background:var(--red)}.sh.wk .bar{background:var(--blue)}.sh.all .bar{background:var(--gold)}
.empty{color:var(--ink3);font-size:14px;margin:2px 4px 6px}
.card{background:var(--card);border-radius:var(--r);padding:14px 16px;margin:10px 0;box-shadow:var(--sh)}
/* patient card */
.pt{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px}
.av{width:46px;height:46px;flex:none;border-radius:15px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:var(--g8);background:var(--g2)}
.av.F{background:#f7e3e8;color:#9b3953}.av.M{background:var(--blue1);color:var(--blue)}
.pt .info{flex:1;min-width:0}
.pt .nm{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt .meta{color:var(--ink2);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:8px;padding:2px 8px;margin-top:5px;margin-right:4px}
.tag.c{background:var(--gold2);color:#8a5a12}
.tag.n{background:var(--g1);color:var(--g7)}.tag.n.od{background:var(--red1);color:var(--red)}
.ic{width:40px;height:40px;flex:none;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--g1);text-decoration:none}
.ic svg{width:19px;height:19px;fill:none;stroke:var(--g7);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.wa{background:#e4f6ea}.ic.wa svg{stroke:#1f8a4c}
/* forms */
label{display:block;font-size:12.5px;color:var(--ink2);font-weight:700;margin:14px 0 6px;letter-spacing:.2px}
input,textarea,select{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:#fcfbf8;font-family:inherit;color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--g6);box-shadow:0 0 0 3px #3a7a5526;background:#fff}
textarea{resize:vertical;min-height:52px;line-height:1.45}
.fsec{margin:18px 0 4px;display:flex;align-items:center;gap:10px;color:var(--g8);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.7px}
.fsec::after{content:"";flex:1;height:1px;background:var(--line)}
.fsec:first-child{margin-top:2px}
h4{margin:14px 0 4px;color:var(--g7);font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{border:1px solid var(--line);background:#fcfbf8;border-radius:11px;padding:9px 13px;font-size:14px;color:var(--ink2);font-weight:600}
.chips button.on{background:var(--g8);color:#fff;border-color:var(--g8)}
.quick{margin-top:8px}.quick button{padding:6px 10px;font-size:12.5px}
.irow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:var(--ink2);font-weight:600}
.int{flex:none;gap:5px}.int button{width:42px;padding:8px 0;text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid3{display:grid;grid-template-columns:1fr 1.3fr .7fr;gap:6px;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:13px;padding:13px 16px;font-size:15px;font-weight:700;background:var(--g8);color:#fff;text-decoration:none;text-align:center}
.btn.sec{background:var(--g1);color:var(--g8)}
.btn.gold{background:var(--gold);color:#fff}
.btn.red{background:var(--red1);color:var(--red)}
.btn.sm{padding:9px 12px;font-size:13px;border-radius:11px}
.btn.w{width:100%}
.row{display:flex;gap:8px;align-items:center}
.fab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));height:58px;padding:0 22px 0 18px;border-radius:20px;border:0;background:var(--gold);color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px #c98a2b66;z-index:15}
.fab span{font-size:26px;font-weight:600;line-height:1}
.savebar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);z-index:16}
.savebar .btn{width:100%;max-width:652px;display:flex;margin:auto;font-size:16.5px;padding:15px;box-shadow:0 6px 18px #1f4d3355}
.med{border:1px solid var(--line);border-radius:14px;padding:9px;margin:8px 0;background:#fcfbf8}
.x{border:0;background:var(--red1);color:var(--red);border-radius:11px;width:42px;height:44px;font-size:15px;flex:none}
/* patient view */
.phead{margin:0 -14px;padding:16px 18px 20px;background:linear-gradient(160deg,var(--g9),var(--g7));color:#fff}
.phead .top{display:flex;gap:14px;align-items:center}
.phead .av{width:58px;height:58px;font-size:20px;border-radius:18px;background:#ffffff22;color:#fff}
.phead .nm{font-size:20px;font-weight:800}
.phead .meta{opacity:.8;font-size:13.5px;margin-top:3px}
.phead .acts{display:flex;gap:8px;margin-top:14px}
.phead .acts a,.phead .acts button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:#ffffff1a;border:1px solid #ffffff2a;color:#fff;border-radius:12px;padding:10px;font-size:13.5px;font-weight:700;text-decoration:none}
.phead svg{width:17px;height:17px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.due{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 0;padding:12px 14px;background:var(--g1);border-radius:14px;font-size:14px;color:var(--g8)}
.due.od{background:var(--red1);color:var(--red)}
.link{background:none;border:0;color:inherit;opacity:.8;text-decoration:underline;font-size:12.5px;font-weight:600}
.kv{margin:6px 0;font-size:14px;line-height:1.5}.kv b{color:var(--ink2);font-weight:700}
.rx{margin:4px 0 0;padding-left:20px}.rx li{margin:3px 0}
details.card{padding:0;overflow:hidden}
details.card summary{list-style:none;padding:14px 16px;display:flex;align-items:center;gap:10px}
details.card summary::-webkit-details-marker{display:none}
details.card summary .d{flex:none;text-align:center;background:var(--g1);color:var(--g8);border-radius:12px;padding:6px 9px;font-weight:800;line-height:1.1;font-size:17px}
details.card summary .d small{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase}
details.card summary .s{flex:1;min-width:0;font-size:14px}
details.card summary .s b{display:block;font-size:14.5px}
details.card summary .s span{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
details.card summary .chev{color:var(--ink3);transition:.2s;font-size:18px}
details[open].card summary .chev{transform:rotate(90deg)}
details .body{padding:0 16px 16px;border-top:1px solid var(--line)}
.lastv{background:var(--gold2);color:#6b4710;border-radius:14px;padding:11px 14px;font-size:13.5px;margin:12px 0 0;line-height:1.5}
.warn{display:flex;gap:10px;align-items:center;background:#fff6e3;border:1px solid #f0d9a6;border-radius:15px;padding:11px 13px;font-size:13.5px;margin:12px 0 0;color:#6b4710}
.warn .btn{flex:none}
/* settings */
.set h3{margin:0 0 4px;font-size:16px;font-weight:800}
.muted{color:var(--ink2);font-size:13.5px;line-height:1.5}
.clist{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.clist span{display:inline-flex;align-items:center;gap:6px;background:var(--g1);color:var(--g8);border-radius:10px;padding:7px 6px 7px 12px;font-size:13.5px;font-weight:700}
.clist span button{border:0;background:#fff;color:var(--red);border-radius:7px;width:24px;height:24px;font-size:12px}
/* sheet */
.sheet{position:fixed;inset:0;background:#0007;z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fd .15s}
.sheet .in{background:var(--card);width:100%;max-width:680px;border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out;max-height:80vh;overflow:auto}
.sheet .grab{width:40px;height:4px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 10px;font-size:16px}
.sheet .opt{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;padding:14px 6px;font-size:15.5px;font-weight:600;border-bottom:1px solid var(--line);color:var(--ink);text-align:left}
.sheet .opt.on{color:var(--g7)}.sheet .opt.on::after{content:"✓";font-weight:800}
@keyframes up{from{transform:translateY(40px);opacity:.4}}@keyframes fd{from{opacity:0}}
.lock{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--g9),var(--g7));color:#fff;margin:0 -14px;padding:20px}
.lock .logo{width:76px;height:76px;border-radius:24px;background:#ffffff1c;display:flex;align-items:center;justify-content:center;font-size:38px;margin-bottom:14px}
.lock input{max-width:220px;text-align:center;font-size:26px;letter-spacing:10px;margin:14px auto;background:#ffffff16;border-color:#ffffff40;color:#fff}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(10px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:50}
#toast.show{opacity:1;transform:translateX(-50%)}
.fade{animation:fd .18s}
.cst{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;border-radius:20px;padding:5px 11px;background:#ffffff1c;color:#fff;margin-left:6px;vertical-align:middle}
.cst i{width:8px;height:8px;border-radius:50%;background:#aaa;font-style:normal}
.cst.ok i{background:#5fd38d}.cst.pend i,.cst.sync i{background:#f2c14e}.cst.err i,.cst.out i{background:#ff8a7a}
.set .cst{background:var(--g1);color:var(--g8);margin:0}
.cloud{display:flex;gap:10px;align-items:center;background:var(--blue1);border:1px solid #c9dff2;border-radius:15px;padding:11px 13px;font-size:13.5px;margin:12px 0 0;color:#1d4f7a}
</style>
</head>
<body>
<header id="hdr"><button class="hb" id="back" aria-label="Back">‹</button><h1 id="title">Patients</h1><button class="hb" id="menu" aria-label="Settings">⚙︎</button></header>
<main id="app"></main>
<div id="toast"></div>
<datalist id="medlist"></datalist>
<datalist id="doselist"><option value="1-0-1"><option value="1-1-1"><option value="0-0-1"><option value="1-0-0"><option value="2-0-2"><option value="3-0-3"><option value="15 ml - 0 - 15 ml"><option value="10 ml - 0 - 10 ml"><option value="1 tsp - 0 - 1 tsp"><option value="External use"></datalist>
<script>
'use strict';
/* Same storage key as the old app, so existing data stays */
const KEY='ayurPatientNotes_v1';
const CENTRES=['Melattur','Perinthalmanna','Pulamanthole','Mannarkkad','Changaramkulam','Valanchery','Mannarmala'];
const app=document.getElementById('app');
const $=s=>document.querySelector(s);
let db=load(),stack=[],fc=null;

function norm(d){d=Object.assign({patients:[],meds:[],pin:null,clinic:'',lastBackup:'',centres:[],curCentre:''},d||{});
 CENTRES.forEach(c=>{if(!d.centres.includes(c))d.centres.push(c)});d.patients.forEach(p=>{p.visits=p.visits||[]});return d}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.patients))return norm(d)}catch(e){}return norm()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Save ചെയ്യാൻ കഴിഞ്ഞില്ല: '+e.message)}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
function addDays(s,n){const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return iso(d)}
function nice(s){if(!s)return'';const p=String(s).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s}
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hash(s){let h=5381;for(const c of String(s))h=((h<<5)+h+c.charCodeAt(0))|0;return 'h'+h}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1700)}
const ini=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const I={
 call:'<svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>',
 wa:'<svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1 1 21 11.5z"/></svg>',
 edit:'<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>'
};

/* ---------- form schemas ---------- */
const O={appetite:['Normal','Reduced','Increased','Variable'],bowel:['Regular','Constipated','Loose','Irregular','Mucus'],mict:['Normal','Frequent','Reduced','Burning','Nocturia'],sleep:['Sound','Disturbed','Reduced','Excess','Day sleep']};
const VITALS=[['h','Vitals'],['bp','s','BP (mmHg)'],['pr','n','Pulse rate /min'],['wt','n','Weight (kg)'],['rbs','n','RBS'],['fbs','n','FBS'],['ppbs','n','PPBS'],['chol','n','Total cholesterol'],['tsh','s','Other (TSH, Hb…)'],['vnote','text','Lab / vitals notes']];
const DOSHA3=['Vata','Pitta','Kapha'];
const NADI=[
 ['h','Nadi 1 · Immediate expression'],
 ['ie_q','chips','Quality',['Pricking','Soft']],
 ['ie_i','int','Index finger'],['ie_m','int','Middle finger'],['ie_r','int','Ring finger'],
 ['ie_rh','chips','Rhythm',['Regular','Irregular']],['ie_v','chips','Volume',['Full','Empty']],['ie_t','chips','Temperature',['Hot','Normal']],
 ['h','Nadi 2 · Superficial expression'],
 ['se_ip','multi','Index – pulse felt',DOSHA3],['se_i','int','Index – intensity'],
 ['se_mp','multi','Middle – pulse felt',DOSHA3],['se_m','int','Middle – intensity'],
 ['se_rp','multi','Ring – pulse felt',DOSHA3],['se_r','int','Ring – intensity'],
 ['h','Nadi 3 · Prakriti'],
 ['pk_i','int','Index (Vata)'],['pk_m','int','Middle (Pitta)'],['pk_r','int','Ring (Kapha)'],
 ['prakriti','pk','Prakriti (സ്വയം വരും – മാറ്റാം)'],
 ['h','Nadi 4 · Subdosha level'],
 ['sd_v','multi','Vata',['Prana','Udana','Vyana','Samana','Apana']],
 ['sd_p','multi','Pitta',['Pachaka','Ranjaka','Sadhaka','Alochaka','Bhrajaka']],
 ['sd_k','multi','Kapha',['Kledaka','Avalambaka','Bodhaka','Tarpaka','Shleshaka']],
 ['h','Nadi 5 · Dhatu level'],
 ['dhatu','multi','Dhatu',['Rasa','Rakta','Mamsa','Meda','Asthi','Majja','Shukra/Artava']],
 ['nnote','area','Nadi notes']];
function autoPrakriti(){const g=k=>{const b=app.querySelector(`[data-f=${k}] .on`);return b?+b.textContent:0};const el=app.querySelector('[data-f=prakriti]');if(el)el.value=`V${g('pk_i')} P${g('pk_m')} K${g('pk_r')}`}
const TAIL=[['h','Examination'],['exam','area','Other examinations (Ashtavidha / Dashavidha / systemic…)'],['h','Assessment'],['dx','area','Diagnosis'],['meds','meds','Medicines'],['advice','area','Pathya / Advice'],['next','next','Next visit (അടുത്ത തീയതി)']];
const S={

const SMALL={n:1,s:1,p:1,d:1};
function fields(sch,v,fem){let h='',g=false;for(const f of sch){const sm=SMALL[f[1]];if(sm&&!g){h+='<div class="grid">';g=true}if(!sm&&g){h+='</div>';g=false}h+=one(f,v[f[0]],fem)}if(g)h+='</div>';return h}
function one([k,t,l,o],val,fem){
 switch(t){
 case'h':return `<div class="fsec">${l}</div>`;
 case'F':return `<div class="fem" style="${fem?'':'display:none'}"><div class="fsec">${l}</div>`;
 case'/F':return '</div>';
 case'centre':return one([k,'chips',l,db.centres],val);
 case'chips':case'multi':{const sel=t==='multi'?(Array.isArray(val)?val:[]):[val];return `<label>${l}</label><div class="chips" data-f="${k}" data-m="${t==='multi'?1:0}">${o.map(x=>`<button type="button" class="${sel.includes(x)?'on':''}">${esc(x)}</button>`).join('')}</div>`}
 case'int':return `<div class="irow"><span>${l}</span><div class="chips int" data-f="${k}" data-m="0">${['0','1','2','3'].map(x=>`<button type="button" class="${String(val)===x?'on':''}">${x}</button>`).join('')}</div></div>`;
 case'pk':return `<label>${l}</label><input data-f="${k}" type="text" placeholder="V0 P0 K0" value="${esc(Array.isArray(val)?val.join(', '):val)}">`;
 case'area':return `<label>${l}</label><textarea data-f="${k}" rows="2">${esc(val)}</textarea>`;
 case'meds':return `<div class="fsec">${l}</div><div id="meds">${(val||[]).map(medRow).join('')}</div><button type="button" class="btn sec sm" onclick="addMed()">＋ മരുന്ന് ചേർക്കുക</button>`;
 case'next':return `<div class="fsec">${l}</div><input data-f="next" type="date" value="${esc(val)}"><div class="chips quick">${[3,5,7,10,15,21,30,45].map(n=>`<button type="button" data-d="${n}">+${n}d</button>`).join('')}</div>`;
 case'n':return `<div><label>${l}</label><input data-f="${k}" type="text" inputmode="decimal" value="${esc(val)}"></div>`;
 case'p':return `<div><label>${l}</label><input data-f="${k}" type="tel" value="${esc(val)}"></div>`;
 case'd':return `<div><label>${l}</label><input data-f="${k}" type="date" value="${esc(val)}"></div>`;
 case's':return `<div><label>${l}</label><input data-f="${k}" type="text" value="${esc(val)}"></div>`;
 case'date':return `<label>${l}</label><input data-f="${k}" type="date" value="${esc(val)}">`;
 default:return `<label>${l}</label><input data-f="${k}" type="text" value="${esc(val)}">`;
 }}
function medRow(m={}){return `<div class="med"><div class="row"><input class="mn" list="medlist" placeholder="മരുന്നിന്റെ പേര്" value="${esc(m.n)}"><button type="button" class="x" onclick="this.closest('.med').remove()">✕</button></div><div class="grid3"><input class="md" list="doselist" placeholder="Dose 1-0-1" value="${esc(m.d)}"><select class="mt">${TIMES.map(x=>`<option ${x===(m.t||'—')?'selected':''}>${x}</option>`).join('')}</select><input class="mu" inputmode="numeric" placeholder="Days" value="${esc(m.u)}"></div></div>`}

function collect(root){const o={};root.querySelectorAll('[data-f]').forEach(e=>{const k=e.dataset.f;if(e.classList.contains('chips')){const s=[...e.querySelectorAll('.on')].map(b=>b.textContent);o[k]=e.dataset.m==='1'?s:(s[0]||'')}else o[k]=e.value.trim()});
 if(root.querySelector('#meds'))o.meds=[...root.querySelectorAll('.med')].map(r=>({n:r.querySelector('.mn').value.trim(),d:r.querySelector('.md').value.trim(),t:r.querySelector('.mt').value,u:r.querySelector('.mu').value.trim()})).filter(m=>m.n);return o}

function phoneDigits(s){let d=String(s||'').replace(/\D/g,'');if(d.length===11&&d[0]==='0')d=d.slice(1);if(d.length===10)d='91'+d;return d}

 $('#q').oninput=e=>{const q=e.target.value.trim().toLowerCase();$('#dash').style.display=q?'none':'';$('#res').innerHTML=q?`<div class="sh"><span class="bar"></span>തിരച്ചിൽ ഫലം</div>`+list(db.patients.filter(p=>[p.name,p.phone,p.place,p.centre].join(' ').toLowerCase().includes(q))):''};

function backupWarn(){if(cloud.st==='out')return `<div class="cloud"><div style="flex:1">☁️ ദിവസവും ബാക്കപ്പ് വേണ്ടാതിരിക്കാൻ Cloud-ൽ ലോഗിൻ ചെയ്യുക</div><button class="btn sm" onclick="go(settings)">ലോഗിൻ</button></div>`;if(cloud.st==='ok'||!db.patients.length)return'';const d=db.lastBackup;if(d&&d>=addDays(today(),-7))return'';return `<div class="warn"><div style="flex:1">💾 ${d?'അവസാന ബാക്കപ്പ്: <b>'+nice(d)+'</b>':'ഇതുവരെ ബാക്കപ്പ് എടുത്തിട്ടില്ല'}</div><button class="btn gold sm" onclick="exportData()">ബാക്കപ്പ്</button></div>`}
const sect=(id,t,arr,cls)=>`<div class="sh ${cls}" id="${id}"><span class="bar"></span>${t}<span class="n">${arr.length}</span></div>`+(arr.length?list(arr):'<div class="empty">ആരുമില്ല</div>');

 <div class="row" style="margin-top:14px;flex-wrap:wrap"><button class="btn sec sm" onclick="go(visitForm,'${p.id}','${v.id}')">✏️ Edit</button>${v.meds&&v.meds.length?`<button class="btn sec sm" onclick="shareRx('${p.id}','${v.id}')">💬 Rx WhatsApp</button>`:''}<button class="btn red sm" onclick="delVisit('${p.id}','${v.id}')">🗑</button></div></div></details>`;

function summary(v,sch){
 let h='',head='';
 for(const[k,t,l]of sch){
  if(t==='h'||t==='F'){head=l;continue}if(t==='/F')continue;
  let val=v[k];
  if(t==='meds'){if(!val||!val.length)continue;val='<ol class="rx">'+val.map(m=>`<li><b>${esc(m.n)}</b> ${esc([m.d,m.t&&m.t!=='—'?m.t:'',m.u&&m.u+' days'].filter(Boolean).join(' · '))}</li>`).join('')+'</ol>'}
  else{if(Array.isArray(val))val=val.join(', ');if(val===undefined||val===null||val==='')continue;val=(t==='next'||t==='d'||t==='date')?nice(val):esc(val).replace(/\n/g,'<br>')}
  if(head){h+=`<h4>${head}</h4>`;head=''}
  h+=`<div class="kv"><b>${l}:</b> ${val}</div>`;
 }
 return h||'<div class="muted" style="margin-top:10px">വിവരങ്ങൾ ഒന്നുമില്ല</div>';
}

async function shareFile(blob,name){
 try{const file=new File([blob],name,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return true}}catch(e){if(e.name==='AbortError')return false}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();return true;

function exportCSV(c){

 const q=s=>{s=Array.isArray(s)?s.join(', '):String(s??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
 const rows=[cols];
 db.patients.filter(p=>!c||p.centre===c).forEach(p=>{const vs=sortVisits(p).reverse();(vs.length?vs:[{}]).forEach(v=>rows.push([p.centre,p.name,p.gender,p.age,p.phone,p.occ,p.place,nice(v.date),v.type?(v.type==='first'?'First':'Review'):'',v.cc||v.review,v.hpi,v.dx,v.prakriti,(v.meds||[]).map(m=>[m.n,m.d,m.t!=='—'?m.t:'',m.u&&m.u+'d'].filter(Boolean).join(' ')).join('; '),v.advice,nice(v.next)]))});
 const csv='﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n');
 shareFile(new Blob([csv],{type:'text/csv'}),`ayur-patients${c?'-'+c:''}-${today()}.csv`).then(ok=>ok&&toast('Excel ഫയൽ റെഡി ✓'));

 const have=new Set(db.patients.map(p=>p.id)),add=d.patients.filter(p=>!have.has(p.id));
 if(!confirm(`Backup-ൽ ${d.patients.length} രോഗികൾ ഉണ്ട്. അതിൽ ${add.length} പേർ പുതുതായി ചേർക്കും (ഇപ്പോഴുള്ളവർ മാറില്ല). തുടരട്ടെ?`))return;
 add.forEach(p=>{p.visits=p.visits||[];delete p._s;db.patients.push(p);push(p)});
 (d.meds||[]).forEach(m=>{if(!db.meds.some(x=>x.toLowerCase()===String(m).toLowerCase()))db.meds.push(m)});db.meds.sort((a,b)=>a.localeCompare(b));
 (d.centres||[]).forEach(c=>{if(!db.centres.includes(c))db.centres.push(c)});
 if(!db.clinic&&d.clinic)db.clinic=d.clinic;
 save();refreshMedlist();pushMeta();toast(add.length+' രോഗികൾ ചേർത്തു ✓');stack=[[home,[]]];render()}catch(e){alert('ഇത് ശരിയായ backup ഫയൽ അല്ല')}};r.readAsText(f)}

const SDK='https://www.gstatic.com/firebasejs/10.14.1/';
let cloud={st:'load',user:null,unsub:[],ready:false,err:''},locked=false;
const CST={load:'Cloud…',out:'Cloud ഓഫ്',sync:'Sync ചെയ്യുന്നു…',ok:'Cloud-ൽ സേവ് ആയി',pend:'Sync ബാക്കിയുണ്ട്',offline:'ഓഫ്‌ലൈൻ',err:'Cloud പ്രശ്നം'};

function setCloud(st,err){if(cloud.st===st&&!err)return;cloud.st=st;if(err!==undefined)cloud.err=err;

function loadJS(u){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function cloudInit(){
 try{if(!window.firebase){await loadJS(SDK+'firebase-app-compat.js');await Promise.all([loadJS(SDK+'firebase-auth-compat.js'),loadJS(SDK+'firebase-firestore-compat.js')])}}
 catch(e){setCloud('offline');setTimeout(cloudInit,60000);return}
 try{firebase.initializeApp(FB)}catch(e){}
 try{await firebase.firestore().enablePersistence({synchronizeTabs:true})}catch(e){}
 cloud.ready=true;
 firebase.auth().onAuthStateChanged(u=>{cloud.user=u;stopSync();if(u)startSync();else setCloud('out')});
}
const fsRoot=()=>firebase.firestore().collection('users').doc(cloud.user.uid);
const col=()=>fsRoot().collection('patients');
const metaRef=()=>fsRoot().collection('meta').doc('settings');
const live=()=>cloud.ready&&cloud.user&&cloud.synced;
function clean(p){const o=JSON.parse(JSON.stringify(p));delete o._s;for(const k of Object.keys(o))if(/[\/.]/.test(k)||/^__.*__$/.test(k))delete o[k];
 (o.visits||[]).forEach(v=>{for(const k of Object.keys(v))if(/[\/.]/.test(k)||/^__.*__$/.test(k))delete v[k]});return o}
function touch(p){if(!p)return;p.updated=Date.now();save();push(p)}
function push(p){if(!live())return;if(!p.updated)p.updated=Date.now();
 col().doc(p.id).set(clean(p)).then(()=>{p._s=1;save()}).catch(e=>setCloud('err',e.code||e.message))}
function cloudDel(id){if(live())col().doc(id).delete().catch(e=>setCloud('err',e.code||e.message))}
function pushMeta(){if(!live())return;db.metaUpdated=Date.now();save();
 metaRef().set({meds:db.meds,centres:db.centres,clinic:db.clinic||'',updated:db.metaUpdated}).catch(e=>setCloud('err',e.code||e.message))}
function mergeMeta(m){if(!m)return false;let ch=false;
 (m.meds||[]).forEach(x=>{if(!db.meds.some(y=>y.toLowerCase()===String(x).toLowerCase())){db.meds.push(x);ch=true}});
 (m.centres||[]).forEach(c=>{if(!db.centres.includes(c)){db.centres.push(c);ch=true}});
 if(m.clinic&&(m.updated||0)>(db.metaUpdated||0)&&m.clinic!==db.clinic){db.clinic=m.clinic;ch=true}
 if(ch){db.meds.sort((a,b)=>a.localeCompare(b));refreshMedlist()}return ch}
function softRender(){if(locked||!stack.length)return;const[fn,a]=stack[stack.length-1];

function stopSync(){cloud.unsub.forEach(f=>{try{f()}catch(e){}});cloud.unsub=[];cloud.synced=false}
function startSync(){
 setCloud('sync','');
 cloud.unsub.push(metaRef().onSnapshot(s=>{if(mergeMeta(s.data())){save();softRender()}},()=>{}));
 cloud.unsub.push(col().onSnapshot({includeMetadataChanges:true},snap=>{
  let ch=false;
  snap.docChanges().forEach(c=>{
   const id=c.doc.id,d=c.doc.data(),i=db.patients.findIndex(p=>p.id===id);
   if(c.type==='removed'){if(cloud.synced&&i>=0&&!c.doc.metadata.hasPendingWrites){db.patients.splice(i,1);ch=true}return}
   if(i<0){db.patients.push({...d,visits:d.visits||[],_s:1});ch=true}
   else if((d.updated||0)>(db.patients[i].updated||0)){db.patients[i]={...d,visits:d.visits||[],_s:1};ch=true}
  });
  if(!cloud.synced&&!snap.metadata.fromCache){
   /* first full server copy: upload what's only here, drop what was deleted elsewhere */
   const cm=new Map(snap.docs.map(d=>[d.id,d.data()]));
   cloud.synced=true;
   db.patients=db.patients.filter(p=>{const c=cm.get(p.id);
    if(!c){if(p._s){ch=true;return false}push(p);return true}
    if((p.updated||0)>(c.updated||0))push(p);else if(!p._s){p._s=1;ch=true}
    return true});
   pushMeta();
  }
  if(ch){save();softRender()}
  setCloud(!cloud.synced||snap.metadata.fromCache?(navigator.onLine?'sync':'offline'):snap.metadata.hasPendingWrites?'pend':'ok','');
 },e=>{setCloud('err',e.code||e.message)}));
}

 else if(!cloud.ready)h+='<p class="muted">ഇന്റർനെറ്റ് ഇല്ല. ഡാറ്റ ഫോണിൽ സേവ് ആകുന്നുണ്ട്; നെറ്റ് വന്നാൽ തനിയെ Cloud-ലേക്ക് പോകും.</p>';
 else if(!u)h+=`<p class="muted">Firebase-ൽ ഉണ്ടാക്കിയ ഇമെയിലും പാസ്‌വേഡും നൽകുക. ലോഗിൻ ചെയ്താൽ എല്ലാ വിവരങ്ങളും തനിയെ Cloud-ൽ സേവ് ആകും; ഫോണിലും ലാപ്ടോപ്പിലും ഒരേ ഡാറ്റ കാണാം.</p>
  <label>Email</label><input id="ce" type="email" autocomplete="username" placeholder="you@gmail.com"><label>Password</label><input id="cp" type="password" autocomplete="current-password">
  <button class="btn w" style="margin-top:12px" onclick="cloudLogin()">ലോഗിൻ ചെയ്യുക</button>`;
 else h+=`<p class="muted">ലോഗിൻ: <b>${esc(u.email)}</b><br>ഓരോ Save-ഉം തനിയെ Cloud-ലേക്ക് പോകും. ഇനി ദിവസവും ഡൗൺലോഡ് ചെയ്യേണ്ട.</p>
  ${s==='err'?`<p class="muted" style="color:var(--red)">${/permission/.test(cloud.err)?'Firestore Rules ശരിയാക്കിയിട്ടില്ല.':'പ്രശ്നം: '+esc(cloud.err)}</p>`:''}
  <button class="btn sec sm" onclick="cloudLogout()">ലോഗൗട്ട്</button>`;
